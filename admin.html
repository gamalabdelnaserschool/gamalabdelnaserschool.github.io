<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم — الثانوية العسكرية بنين</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.panel{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--gold);padding:1.5rem;margin-block:2rem}
.panel h2{font-size:1.4rem}
label{display:block;font-weight:600;margin:.8rem 0 .2rem}
input,select,textarea{width:100%;font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:4px;background:var(--mist)}
textarea{min-height:110px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
button.btn{cursor:pointer;font:inherit;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.item small{color:#5b6890}
.msg{margin-top:.8rem;color:#a02020}.ok{color:#1f7a3f}
.hidden{display:none}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span>لوحة التحكم</span></a>
  <button id="logout" class="btn line hidden" style="color:var(--gold-2);background:none;cursor:pointer">تسجيل الخروج</button>
</div></header>

<main class="wrap">
  <section id="login" class="panel">
    <h2>تسجيل دخول الإدارة</h2>
    <label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username">
    <label for="pass">كلمة المرور</label><input id="pass" type="password" autocomplete="current-password">
    <div class="row"><button id="loginBtn" class="btn gold">دخول</button></div>
    <p id="loginMsg" class="msg"></p>
  </section>

  <div id="app" class="hidden">
    <section class="panel">
      <h2>إضافة محتوى جديد</h2>
      <label for="col">القسم</label>
      <select id="col">
        <option value="news">الأخبار</option>
        <option value="activities">الأنشطة</option>
        <option value="achievements">الإنجازات</option>
        <option value="competitions">المسابقات</option>
      </select>
      <label for="title">العنوان</label><input id="title">
      <label for="summary">ملخص قصير</label><input id="summary">
      <label for="details">التفاصيل</label><textarea id="details"></textarea>
      <label for="image">رابط الصورة (اختياري)</label><input id="image" type="url" dir="ltr" placeholder="https://">
      <div class="row"><button id="saveBtn" class="btn gold">نشر</button></div>
      <p id="saveMsg" class="msg"></p>
    </section>
    <section class="panel">
      <h2>المحتوى المنشور</h2>
      <div id="items"></div>
    </section>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = (id, t, ok) => { $(id).textContent = t; $(id).className = 'msg' + (ok ? ' ok' : ''); };

auth.onAuthStateChanged(u => {
  $('login').classList.toggle('hidden', !!u);
  $('app').classList.toggle('hidden', !u);
  $('logout').classList.toggle('hidden', !u);
  if (u) loadItems();
});

$('loginBtn').onclick = async () => {
  try { await auth.signInWithEmailAndPassword($('email').value.trim(), $('pass').value); }
  catch { say('loginMsg', 'البريد الإلكتروني أو كلمة المرور غير صحيحة.'); }
};
$('logout').onclick = () => auth.signOut();

$('saveBtn').onclick = async () => {
  const title = $('title').value.trim();
  if (!title) return say('saveMsg', 'اكتب العنوان أولًا.');
  try {
    await db.collection($('col').value).add({
      title, summary: $('summary').value.trim(), details: $('details').value.trim(),
      image: $('image').value.trim(), date: firebase.firestore.FieldValue.serverTimestamp()
    });
    ['title','summary','details','image'].forEach(i => $(i).value = '');
    say('saveMsg', 'تم النشر.', true); loadItems();
  } catch (e) { console.error(e); say('saveMsg', 'تعذر النشر. تأكد أن حسابك مسموح له بالكتابة في قواعد Firestore.'); }
};

async function loadItems() {
  const col = $('col').value;
  try {
    const snap = await db.collection(col).orderBy('date', 'desc').get();
    $('items').innerHTML = snap.empty ? '<p>لا يوجد محتوى في هذا القسم بعد.</p>' :
      snap.docs.map(d => `<div class="item"><div><strong>${esc(d.data().title)}</strong><br><small>${esc(d.data().summary)}</small></div>
      <button class="btn line" style="color:#a02020;border-color:#a02020;background:none" data-id="${d.id}">حذف</button></div>`).join('');
  } catch (e) { console.error(e); $('items').innerHTML = '<p>تعذر تحميل المحتوى.</p>'; }
}
$('col').onchange = loadItems;
$('items').onclick = async e => {
  const id = e.target.dataset.id;
  if (id && confirm('حذف هذا العنصر نهائيًا؟')) { await db.collection($('col').value).doc(id).delete(); loadItems(); }
};
</script>
</body>
</html>
